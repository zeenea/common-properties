datasource:
  keys:
    - type
    - account_id
  values:
    type: snowflake

datasets:
  - name: AccountForV1Connector
    identification:
      keys:
        - account_id
        - catalog
        - schema
        - table
    fields:
      - field_key
  - name: Table
    identification:
      keys:
        - catalog
        - schema
        - table
    fields:
      - field_key
  - name: TableForV1Connector
    identification:
      keys:
        - schema
        - table
    fields:
      - field_key

dataProcesses:
  - name: PipeLineage
    identification:
      keys:
        - pipe_marker
        - catalog
        - schema
        - pipe
      values:
        pipe_marker: pipe
  - name: HistoryLineage
    identification:
      keys:
        - query_type
        - hash