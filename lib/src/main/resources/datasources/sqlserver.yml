datasource:
  keys:
    - type
    - host
    - port
  values:
    type: sqlserver
datasets:
  - name: Table
    identification:
      keys:
        - catalog
        - schema
        - table
    fields:
      - field_key
dataProcesses:
  - name: ProcedureLineage
    identification:
      keys:
        - procedure_marker
        - catalog
        - schema
        - procedure
      values:
        procedure_marker: stored_proc
