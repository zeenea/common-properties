datasource:
  keys:
    - type
    - host
  values:
    type: qlik-cloud

datasets:
  - name: Embedded Dataset
    identification:
      keys:
        - application_id
        - table_name
    fields:
      - field_key
    label:
      keys:
        - application_name
        - table_name

visualizations:
  - name: Visualisation Application
    identification:
      keys:
        - application_id
    fields:
      - field_key
    label:
      keys:
        - application_name