datasource:
  keys:
    - type
    - host
  values:
    type: qlik-cloud

visualizations:
  - name: Visualisation Application
    identification:
      keys:
        - application_id
    fields:
      - field_key
    label:
      keys:
        - type
        - application_name
      values:
        type: application

datasets:
  - name: Application Data Model Table
    identification:
      keys:
        - application_id
        - table_name
    fields:
      - field_key
    label:
      keys:
        - type
        - application_name
        - table_name
      values:
        type: table