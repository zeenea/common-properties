datasource:
  keys:
    - type
    - host
  values:
    type: qlik-cloud

# The space holding an application is in the labels only: Qlik identifies an application by its id
# alone (qri:app:sense://<appId>), which it keeps when the application moves to another space.

visualizations:
  # A sheet, identified within its application by its engine object id (qInfo.qId).
  - name: Sheet
    identification:
      keys:
        - application_id
        - sheet_id
    fields:
      - field_key
    label:
      keys:
        - space_name
        - application_name
        - type
        - sheet_name
      values:
        type: sheet

datasets:
  - name: Table
    identification:
      keys:
        - application_id
        - table_name
    fields:
      - field_key
    label:
      keys:
        - space_name
        - application_name
        - type
        - table_name
      values:
        type: table

  # A QVD file, identified by its lineage QRI (qri:qdf:<space|user>://<hash>#<file id>).
  - name: QvdFile
    identification:
      keys:
        - data_file_qri
    fields:
      - field_key
    label:
      keys:
        - space_name
        - type
        - file_name
      values:
        type: qvd
