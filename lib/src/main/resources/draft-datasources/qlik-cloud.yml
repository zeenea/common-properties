datasource:
  keys:
    - type
    - host
  values:
    type: qlik-cloud

visualizations:
  - name: Application
    identification:
      keys:
        - space_id
        - application_id
    fields:
      - field_key
    label:
      keys:
        - space_name
        - application_name

datasets:
  - name: Table
    identification:
      keys:
        - space_id
        - application_id
        - table_name
    fields:
      - field_key
    label:
      keys:
        - space_name
        - application_name
        - table_name

  # A QVD file, identified by its lineage QRI (qri:qdf:<space|user>://<hash>#<file id>).
  - name: QvdFile
    identification:
      keys:
        - data_file_qri
    fields:
      - field_key
    label:
      keys:
        - space_name
        - file_name
