datasource:
  keys:
    - type
    - host
  values:
    type: qlik-cloud

visualizations:
  - name: Sheet
    identification:
      keys:
        - space_id
        - application_id
        - sheet_id
    fields:
      - field_key
    label:
      keys:
        - space_name
        - application_name
        - type
        - sheet_name
      values:
        type: sheet

datasets:
  - name: Table
    identification:
      keys:
        - space_id
        - application_id
        - table_name
    fields:
      - field_key
    label:
      keys:
        - space_name
        - application_name
        - type
        - table_name
      values:
        type: table

  # A QVD file, identified by its lineage QRI (qri:qdf:<space|user>://<hash>#<file id>).
  - name: QvdFile
    identification:
      keys:
        - data_file_qri
    fields:
      - field_key
    label:
      keys:
        - space_name
        - type
        - file_name
      values:
        type: qvd
