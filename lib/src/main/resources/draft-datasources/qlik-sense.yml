datasource:
  keys:
    - type
    - host
  values:
    type: qlik-sense

visualizations:
  - name: Visualisation Sheet
    identification:
      keys:
        - applicationId
        - sheetId
    fields:
      - field_key
    label:
      keys:
        - type
        - application-name
        - sheet-name
      values:
        type: Sheet

datasets:
  - name: Application Data Model Table
    identification:
      keys:
        - application_id
        - table_name
    fields:
      - field_key
    label:
      keys:
        - type
        - application_name
        - table_name
      values:
        - type: Application Data Model Table
