name: publish

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build and test with Gradle
        run: ./gradlew build
        shell: bash

  publish-zeenea-common-properties:
    needs: build-and-test
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build and Publish with Gradle
        run: ./gradlew publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}

  publish-zeenea-common-properties-ts:
    needs: build-and-test
    if: ${{ !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'yarn'
          cache-dependency-path: 'ts/yarn.lock'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: ts

      - name: Build
        run: yarn build
        working-directory: ts

      - name: Update package version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Ensure version has three parts (add .0 if missing patch version)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${VERSION}.0"
          fi
          npm version $VERSION --no-git-tag-version --allow-same-version
        working-directory: ts

      - name: Publish
        run: npm publish
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
